# Raycast maps the physical Caps Lock key to Hyper: Cmd + Ctrl + Option + Shift.

[hotkeys]
"Cmd+Shift+Space" = "__disabled__"
"Cmd+Ctrl+Alt+Shift+X" = "hints --action left_click"
"Cmd+Shift+S" = "__disabled__"
"Cmd+Ctrl+Alt+Shift+S" = "scroll"
"Cmd+Ctrl+Alt+Shift+R" = "config reload"

[hints.ui]
background_color = "#FFF08A"
text_color = "#111111"
matched_text_color = "#111111"
border_color = "#706020"

[grid]
enabled = false

[recursive_grid]
enabled = false

[scroll]
invert_scroll = true
